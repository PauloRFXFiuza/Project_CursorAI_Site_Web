<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProjectPath - Gerencie suas Tarefas de Desenvolvimento</title>
    <!-- Adicionar Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Adicionar fonte Inter do Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="font-['Inter']">
    <!-- Navbar -->
    <nav class="container mx-auto px-6 py-4 flex items-center justify-between">
        <div class="flex items-center">
            <span class="text-2xl font-bold">ProjectPath</span>
        </div>
        <div class="hidden md:flex items-center space-x-8">
            <a href="#" class="text-blue-600 font-medium">Home</a>
            <a href="#" class="text-gray-600 hover:text-gray-800">About</a>
            <a href="#" class="text-gray-600 hover:text-gray-800">Services</a>
            <a href="#" class="text-gray-600 hover:text-gray-800">Contacts</a>
        </div>
        <button class="bg-gray-900 text-white px-6 py-2 rounded-lg">Log in</button>
    </nav>

    <!-- Hero Section -->
    <main class="container mx-auto px-6 py-16">
        <div class="text-center max-w-3xl mx-auto">
            <h1 class="text-5xl font-bold mb-6">
                Manage Your Development Tasks with Ease
            </h1>
            <p class="text-gray-600 text-lg mb-8">
                Unlock the full potential of your startup with our tailored services designed to guide you through every stage of growth.
            </p>
            <div class="flex justify-center gap-4">
                <button class="bg-[#CDFF63] hover:bg-[#b8e659] text-gray-900 px-6 py-3 rounded-lg font-medium">
                    Start Free Trial
                </button>
                <button class="border border-gray-300 hover:border-gray-400 text-gray-900 px-6 py-3 rounded-lg font-medium">
                    Learn More
                </button>
            </div>
        </div>

        <!-- Dashboard Preview -->
        <div class="mt-16">
            <img src="dashboard.png" alt="Dashboard Preview" class="rounded-lg shadow-2xl mx-auto max-w-5xl w-full" />
        </div>
    </main>
</body>
</html>
